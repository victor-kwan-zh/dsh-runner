<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek Harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #e8eeff;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        overflow: hidden;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
      }
      img {
        width: 128px;
        height: 128px;
        border-radius: 28px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      #status {
        margin: 0;
        font-size: 14px;
        color: #8ea2d8;
      }
      #status.error {
        color: #ff8b8b;
        max-width: 640px;
        text-align: center;
        line-height: 1.5;
      }
      #hint {
        margin: 0;
        font-size: 12px;
        color: #5b6b90;
      }
      .spinner {
        width: 22px;
        height: 22px;
        border: 2px solid #1d2b55;
        border-top-color: #3b59ff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="../assets/icon.png" alt="DeepSeek Harness" />
      <h1>DeepSeek Harness</h1>
      <div class="spinner" aria-hidden="true"></div>
      <p id="status">正在启动 dsh web…</p>
      <p id="hint">默认地址 http://127.0.0.1:3080</p>
    </div>
  </body>
</html>
